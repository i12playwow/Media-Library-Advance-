<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <!--
      NOTE: The CSP below is relaxed for Electron compatibility (allows 'unsafe-eval' and 'wasm-unsafe-eval').
      For production, consider tightening this policy and using Electron's contextIsolation and preload scripts.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob: file: http: https:;
        font-src 'self' data:;
        connect-src 'self' http: https: ws: wss:;
        media-src 'self' data: blob: file: http: https:;
        object-src 'none';
        base-uri 'self';
      "
    />
    <link rel="icon" type="image/png" href="../../resources/icon.png" />
    <title>MLA+</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
