name: Drill

# Weekly behavioral drill (docs/testing.md rules 1–6, CONTRIBUTING layer 2):
# runs scripts/drill-abi-contract.cjs on a clean checkout per OS, uploads the
# resulting summary line per OS, and an append job commits the OS summary
# lines to GUARDS-LOG.md through scripts/append-drill-log.cjs — chained into
# the log's tamper-evident hash chain exactly like local drill entries, so
# CI verdicts are tamper-evident history too (drift class 8).
#
# On Linux the drill job additionally runs the behavioral tamper leg
# (npm run probe:tamper → scripts/tamper-probe.cjs): it runs the guards-chain
# e2e spec, whose own arc tampers one byte of GUARDS-LOG.md's first drill
# entry and requires the real app to serve the tamper as an unverified
# FAILURE through the real preload bridge — the UNVERIFIED half of the chain
# contract, which no structural pin can see. The probe snapshots the log and
# verifies it byte-exact after the run. The leg is Linux-only because it
# launches Electron (xvfb) and the drill leaves the binding Node-ABI, so the
# probe heals its own ABI in the pretest:e2e order (rule 3). Its verdict
# rides in the OS summary line as a `tamper holds|BROKEN` clause: holds only
# when the probe's own egress marker proves the leg passed, BROKEN when it
# failed or never ran — never a fabricated holds.
#
# The append job needs contents: write to push GUARDS-LOG.md; the drill jobs
# stay read-only. The log is append-only with distinct timestamped lines, so
# appends never conflict; a raced push is retried by re-running the appender
# on the fresh tip (up to 3 attempts) rather than force-pushing anything.

on:
  schedule:
    # Weekly, Mondays 04:43 UTC — offset from ci.yml's nightly 03:17.
    - cron: "43 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drill-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  drill:
    name: Drill (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run the drill
        shell: bash
        run: |
          set +e
          npm run drill:abi 2>&1 | tee drill-output.txt
          drill_exit=${PIPESTATUS[0]}
          # The step's exit mirrors the drill's own verdict, not teardown
          # noise: the Linux runner has shown an exit-time SIGSEGV AFTER the
          # full verdict line is already printed (all legs recorded), and
          # propagating that 139 would record a red job over a green
          # contract. Exit 0 only on the exact full-holds verdict; any
          # BROKEN verdict — or a run too broken to print one — keeps the
          # child's real exit code.
          if grep -q 'contract holds (10/10 legs)' drill-output.txt 2>/dev/null; then
            exit 0
          fi
          exit "$drill_exit"
      # The behavioral tamper leg: Electron + xvfb live on Linux, and the
      # drill leaves the binding Node-ABI, so the probe heals its own ABI
      # (the pretest:e2e order) before launching the app. It streams its own
      # progress; the egress marker its stdout ends with on success is what
      # the summary step greps for below. Same system-library gate as ci.yml's
      # e2e job: a headless Linux runner has neither the Chromium libs Electron
      # links against nor a display server — a red leg here would be a
      # preventable crash recorded as history, not a contract break.
      - name: Install Electron system dependencies
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          ok=0
          for attempt in 1 2 3; do
            if npx playwright install-deps chromium; then ok=1; break; fi
            echo "playwright install-deps attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          if [ "$ok" = 0 ]; then
            echo "playwright install-deps failed after 3 attempts" >&2
            exit 1
          fi
          if ! ldconfig -p 2>/dev/null | grep -q "libnss3.so"; then
            echo "libnss3.so missing from the linker cache; install-deps was a silent no-op" >&2
            exit 1
          fi
          echo "Electron system libraries verified in the linker cache"
      - name: Run the tamper probe
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        shell: bash
        run: |
          set +e
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" npm run probe:tamper 2>&1 | tee tamper-output.txt
          exit ${PIPESTATUS[0]}
      - name: Record CI summary
        if: always()
        shell: bash
        run: |
          # The verdict is the drill's own contract line, matched anywhere in
          # its captured output — NOT the file's last line: a Linux exit-time
          # SIGSEGV (teardown after the verdict is already printed) can land
          # "Segmentation fault (core dumped)" after the verdict, and a
          # fabricated BROKEN would then be refused by the appender anyway.
          verdict="$(grep -o 'contract \(BROKEN\|holds\) ([0-9]*/10 legs)' drill-output.txt 2>/dev/null | tail -n 1 || true)"
          case "$verdict" in
            "contract holds ("*|*"contract holds (10/10 legs)"*) ;;
            *) verdict="contract BROKEN (0/10 legs) — drill did not complete" ;;
          esac
          # The tamper clause exists only on the OS that runs the leg, and
          # never claims holds without the probe's egress marker proving it.
          tamper=""
          if [ "${{ runner.os }}" = "Linux" ]; then
            if [ -f tamper-output.txt ] && grep -q "^tamper-probe: leg PASSED" tamper-output.txt; then
              tamper=" · tamper holds"
            else
              tamper=" · tamper BROKEN"
              echo "tamper verdict marker missing — recording the leg as BROKEN" >&2
            fi
          fi
          ts="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          run="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          printf -- "- %s · ci · %s · %s%s · run %s · drill@%s\n" \
            "$ts" "${{ matrix.os }}" "$verdict" "$tamper" "$run" "${GITHUB_SHA::7}" \
            > drill-summary-${{ matrix.os }}.txt
          cat "drill-summary-${{ matrix.os }}.txt"
      - name: Upload the summary line
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: drill-summary-${{ matrix.os }}
          path: drill-summary-${{ matrix.os }}.txt
          retention-days: 30

  append-log:
    name: Append the chained CI summaries
    needs: [drill]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the tip of main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          # The append's push must bypass the main-guard-stack ruleset, whose
          # PR-only + required-checks rules reject the workflow's own
          # GITHUB_TOKEN: ruleset bypass actors are roles/teams/apps/users
          # and GitHub offers no Actions actor to add, so a bot push is
          # always GH013-rejected (three clean appends, three rejections).
          # When GUARDS_PUSH_TOKEN is configured — a fine-grained PAT scoped
          # to this repository with Contents: read and write — checkout
          # wires it into origin's credentials and the push lands as the
          # account that already bypasses; without it the default token is
          # used and the append fails closed, exactly as before.
          token: ${{ secrets.GUARDS_PUSH_TOKEN || github.token }}
      - name: Download the per-OS summary lines
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: drill-summary-*
          merge-multiple: true
          path: summaries
      - name: Append and chain
        shell: bash
        run: |
          set -e
          lines="$(cat summaries/drill-summary-*.txt)"
          export CI_SUMMARY_LINES="$lines"
          node scripts/append-drill-log.cjs
          git add GUARDS-LOG.md
          git -c user.name="guards-bot" -c user.email="guards-bot@users.noreply.github.com" \
            commit -m "chore(guards): scheduled drill summaries chained into GUARDS-LOG"
      - name: Push (re-append on race, up to 3 attempts)
        shell: bash
        run: |
          set -e
          attempt=1
          until git push origin HEAD:main; do
            attempt=$((attempt + 1))
            if [ "$attempt" -gt 3 ]; then
              echo "::error::could not push the chained log append after 3 attempts"
              exit 1
            fi
            echo "push raced with a landing commit — re-appending on the fresh tip (attempt $attempt)"
            git fetch origin main
            git reset --hard origin/main
            lines="$(cat summaries/drill-summary-*.txt)"
            export CI_SUMMARY_LINES="$lines"
            node scripts/append-drill-log.cjs
            git add GUARDS-LOG.md
            git -c user.name="guards-bot" -c user.email="guards-bot@users.noreply.github.com" \
              commit -m "chore(guards): scheduled drill summaries chained into GUARDS-LOG"
            sleep 20
          done
